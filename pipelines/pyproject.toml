[project]
name = "pipelines"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "chromadb>=1.5.9",
    "dagster==1.13.15",
    "dagster-postgres>=0.29.15",
    "dagster-webserver>=1.13.15",
    "openai>=2.48.0",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
]


[dependency-groups]
dev = [
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipelines"
registry_modules = [
    "pipelines.components.*",
]


