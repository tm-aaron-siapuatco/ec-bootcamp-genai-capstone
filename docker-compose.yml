services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  dagster-webserver:
    build:
      context: ./pipelines
      dockerfile: Dockerfile
    image: ${GHCR_IMAGE:-dagster-app:latest}
    container_name: dagster-webserver
    restart: always
    depends_on:
      - postgres
      - chromadb
    entrypoint: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-m", "pipelines.definitions"]
    ports:
      - "3000:3000"
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - DATABASE_HOST=postgres
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-password}
      - DATABASE_NAME=${DATABASE_NAME:-postgres}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - AZURE_OPENAI_API_EMBEDDING_MODEL=${AZURE_OPENAI_API_EMBEDDING_MODEL}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_ENDPOINT=${AZURE_OPENAI_API_ENDPOINT}
    volumes:
      - ./pipelines:/opt/dagster/app
      - dagster_data:/opt/dagster/dagster_home

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    depends_on:
      - postgres
      - chromadb
      - dagster-webserver
    ports:
      - "8001:8001"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-password}
      - DATABASE_NAME=${DATABASE_NAME:-postgres}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - CHROMADB_COLLECTION_NAME=${CHROMADB_COLLECTION_NAME:-knowledge_base}
      - DAGSTER_GRAPHQL_URL=http://dagster-webserver:3000/graphql
      - PIPELINES_PDF_DIR=/pipelines/data/capstone_part_2
      - PIPELINES_CSV_DIR=/pipelines/data/capstone_part_1
      - AZURE_OPENAI_API_EMBEDDING_MODEL=${AZURE_OPENAI_API_EMBEDDING_MODEL}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_API_ENDPOINT=${AZURE_OPENAI_API_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - AZURE_OPENAI_API_CHAT_DEPLOYMENT=${AZURE_OPENAI_API_CHAT_DEPLOYMENT}
    volumes:
      - ./pipelines:/pipelines

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8001

volumes:
  dagster_data:
    driver: local
  chroma_data:
    driver: local
  postgres_data:
    driver: local